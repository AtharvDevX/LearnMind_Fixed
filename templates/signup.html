<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account · LearnMind</title><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"></head>
<body class="auth-body"><a class="auth-back" href="{{ url_for('landing') }}">← Back to LearnMind</a><main class="auth-card"><a class="brand auth-brand" href="{{ url_for('landing') }}"><span class="brand-icon">🧠</span><span>Learn<span class="brand-accent">Mind</span></span></a><span class="eyebrow-pill">START LEARNING BETTER</span><h1>Create your account</h1><p class="auth-subtitle">Your own organized space for smarter study sessions.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash flash-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" action="{{ url_for('signup') }}" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="name">Full name</label><input id="name" type="text" name="name" value="{{ name|default('') }}" placeholder="Enter your name" maxlength="80" autocomplete="name" required><label for="email">Email address</label><input id="email" type="email" name="email" value="{{ email|default('') }}" placeholder="you@example.com" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" name="password" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required><button class="button button-primary button-full" type="submit">Create my account →</button></form><p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Login</a></p></main></body></html>
