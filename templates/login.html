<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login · LearnMind</title><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"></head>
<body class="auth-body"><a class="auth-back" href="{{ url_for('landing') }}">← Back to LearnMind</a><main class="auth-card"><a class="brand auth-brand" href="{{ url_for('landing') }}"><span class="brand-icon">🧠</span><span>Learn<span class="brand-accent">Mind</span></span></a><span class="eyebrow-pill">WELCOME BACK</span><h1>Sign in to continue</h1><p class="auth-subtitle">Pick up where you left off on your learning journey.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash flash-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" action="{{ url_for('login') }}" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="email">Email address</label><input id="email" type="email" name="email" value="{{ email|default('') }}" placeholder="you@example.com" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required><button class="button button-primary button-full" type="submit">Login to LearnMind →</button></form><p class="auth-switch">Don't have an account? <a href="{{ url_for('signup') }}">Create one</a></p></main></body></html>
